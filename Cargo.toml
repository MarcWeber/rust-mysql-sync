[package]
name = "mysql-sync"
version = "0.1.0"
edition = "2021"
description = "Differential MySQL table sync over QUIC with chunked hash comparison"
license = "MIT"

[[bin]]
name = "mysql-sync"
path = "src/main.rs"

[profile.release]
opt-level = 2
debug = false
strip = true
lto = false
codegen-units = 16

[features]
default = ["blake3", "xxhash", "md5", "sha2"]
blake3 = ["dep:blake3"]
xxhash = ["dep:xxhash-rust"]
md5 = ["dep:md-5"]
sha2 = ["dep:sha2"]

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal", "derive"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rkyv = { version = "0.8", features = ["bytecheck"] }
zstd = "0.13"
blake3 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
md-5 = { version = "0.10", optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"], optional = true }
digest = "0.10"
hex = "0.4"
anyhow = "1"
indicatif = "0.18"
rand = "0.9"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
