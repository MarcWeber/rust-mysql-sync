services:
  mysql-src:
    image: mysql:8.0
    container_name: mysqlsync-src
    environment:
      MYSQL_ROOT_PASSWORD: syncroot
      MYSQL_DATABASE: db1
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
      --local_infile=1
    ports:
    - ${MSYNC_SRC_PORT:-7012}:3306
    volumes:
    - ./deploy/seed.sql:/docker-entrypoint-initdb.d/10-seed.sql:ro
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -psyncroot
      interval: 3s
      timeout: 3s
      retries: 30
  mysql-dst:
    image: mysql:9.7
    container_name: mysqlsync-dst
    environment:
      MYSQL_ROOT_PASSWORD: syncroot
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
      --local_infile=1
    ports:
    - ${MSYNC_DST_PORT:-7013}:3306
    volumes: []
    healthcheck:
      test:
      - CMD
      - mysqladmin
      - ping
      - -h
      - 127.0.0.1
      - -uroot
      - -psyncroot
      interval: 3s
      timeout: 3s
      retries: 30
